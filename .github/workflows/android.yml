name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Generate release signing key
        run: |
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/tofu-release.jks" \
            -storetype JKS -alias tofu-release -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname 'CN=Tofu Pet, OU=Mobile, O=Tofu Pet, L=Unknown, ST=Unknown, C=US' >/dev/null 2>&1
          {
            echo "TOFU_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "TOFU_KEY_PASSWORD=$KEY_PASSWORD"
            echo "TOFU_KEY_ALIAS=tofu-release"
          } >> "$GITHUB_ENV"
          {
            echo "Keystore: tofu-release.jks"
            echo "Alias: tofu-release"
            echo "Store password: $STORE_PASSWORD"
            echo "Key password: $KEY_PASSWORD"
            echo "Keep this file private and use the same keystore for future updates."
          } > "$RUNNER_TEMP/signing-info.txt"

      - name: Build debug and signed release APKs
        env:
          TOFU_KEYSTORE_FILE: ${{ runner.temp }}/tofu-release.jks
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tofu-pet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tofu-pet-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signing backup
        uses: actions/upload-artifact@v4
        with:
          name: tofu-pet-signing-backup
          path: |
            ${{ runner.temp }}/tofu-release.jks
            ${{ runner.temp }}/signing-info.txt
          if-no-files-found: error

      - name: Publish build summary
        run: |
          {
            echo '## APK build complete'
            echo ''
            echo '- Debug APK: `tofu-pet-debug-apk` artifact'
            echo '- Signed release APK: `tofu-pet-signed-release-apk` artifact'
          } >> "$GITHUB_STEP_SUMMARY"
