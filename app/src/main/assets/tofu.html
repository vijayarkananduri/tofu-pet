<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tofu Pet</title>
    <link rel="stylesheet" href="tofu.css">
</head>
<body>
    <main class="overlay-root">
        <div class="speech-bubble" id="speechBubble"><span id="speechText"></span></div>
        <section class="pet-stage" aria-label="Tofu pet">
            <svg class="pet" viewBox="0 0 240 170" role="img" aria-label="Tofu">
                <ellipse cx="120" cy="146" rx="78" ry="9" class="pet-shadow" />
                <ellipse cx="120" cy="82" rx="100" ry="60" class="pet-body" />
                <ellipse cx="78" cy="73" rx="17" ry="21" class="pet-eye" />
                <ellipse cx="162" cy="73" rx="17" ry="21" class="pet-eye" />
                <circle cx="82" cy="76" r="7" class="pet-pupil" />
                <circle cx="166" cy="76" r="7" class="pet-pupil" />
                <ellipse cx="57" cy="101" rx="16" ry="8" class="pet-blush" opacity="0" />
                <ellipse cx="183" cy="101" rx="16" ry="8" class="pet-blush" opacity="0" />
                <path d="M 92 106 Q 120 125 148 106" class="pet-mouth" />
            </svg>
        </section>
        <section class="task-bubble" id="taskBubble" aria-live="polite">
            <div class="task-header"><span class="task-icon">⏰</span><span class="task-title" id="taskTitle">You have a task</span></div>
            <div class="task-actions"><button class="task-btn done-btn" id="doneBtn">✓ Done</button><button class="task-btn snooze-btn" id="snoozeBtn">⏰ 5 min</button><button class="task-btn more-btn" id="moreBtn">Open</button></div>
        </section>
    </main>
    <script src="tofu.js"></script>
</body>
</html>
